name: Controleer en publiceer kookboek
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test receptenverwerking
        run: python3 -m unittest discover -s tests -v
      - name: Controleer JavaScript
        run: node --check site/assets/app.js
      - name: Controleer recepten en bouw website
        run: python3 scripts/build.py
        env:
          COOKBOOK_ENV: ${{ github.event_name == 'pull_request' && 'acceptance' || 'production' }}
          SOURCE_SHA: ${{ github.sha }}
      - name: Bewaar controleerbare websiteversie
        uses: actions/upload-artifact@v4
        with:
          name: kookboek-${{ github.sha }}
          path: dist
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
